<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-table">
      <p class="eyebrow">The classic card game</p>
      <h1>Blackjack</h1>
      <div class="divider" aria-hidden="true"></div>
      <p id="message-el" aria-live="polite">Want to play a round?</p>
      <section class="scoreboard" aria-label="Game status">
        <div class="score-panel">
          <p class="score-label">Your cards</p>
          <p id="cards-el">Cards:</p>
        </div>
        <div class="score-panel">
          <p class="score-label">Current total</p>
          <p id="sum-el">Sum:</p>
        </div>
      </section>
      <div class="actions">
        <button type="button" onclick="startGame()">START GAME</button>
        <button type="button" onclick="newCard()">DRAW A CARD</button>
      </div>
      <!-- add player's info container: name, chips,amt -->
      <p id="player-el"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>

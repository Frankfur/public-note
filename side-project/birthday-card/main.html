<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Birthday</title>
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <h1>Today is Si Ersheng's birthday 🎉</h1>
      <img src="img/me.jpg" alt="My photo" class="photo" />
    </header>
    <!-- main content -->
    <main class="main">
      <div class="intro-container">
        <h2><span class="age">42 years old</span></h2>
        <h3><span class="age">05.19.2026</span></h3>
        <p class="happy">I am so happy today 🥳</p>
      </div>

      <!-- containers for gift cards -->
      <div class="gift-container-all">
        <!-- Section 1 -->
        <section class="gift-container">
          <h2 class="gift-title">How do you like it? 👇</h2>
          <div class="gift-container">
            <img src="img/giftbox.gif" alt="giftbox picture" class="giftbox" />
            <img
              src="img/wow.gif"
              alt="people reacting excitedly when you enter the room."
              class="wow"
            />
          </div>
        </section>
        <!-- Section 2 -->
        <section class="gift-container">
          <h2 class="gift-title">One word to myself?👇</h2>
          <div class="gift-container">
            <img src="img/giftbox.gif" alt="giftbox picture" class="giftbox" />
            <img
              src="img/doit.gif"
              alt="GIF showing the words that I inspired to say to myself."
              class="wow"
            />
          </div>
        </section>
        <!-- Section 3 -->
        <section class="gift-container">
          <h2 class="gift-title">When I am thinking...?👇</h2>
          <div class="gift-container">
            <img src="img/giftbox.gif" alt="giftbox picture" class="giftbox" />
            <img
              src="img/thinking.gif"
              alt="picture little child is in deep thought"
              class="wow"
            />
          </div>
        </section>
        <!-- Section 4 -->
        <section class="gift-container">
          <h2 class="gift-title">When I am feeling...?👇</h2>
          <div class="gift-container">
            <img src="img/giftbox.gif" alt="giftbox picture" class="giftbox" />
            <img
              src="img/spaceTeam.gif"
              alt="GIF show a line of astronauts walking in a row in the same pace proudly."
              class="wow"
            />
          </div>
        </section>
      </div>
    </main>
    <!-- footer -->
    <footer class="footer">
      <div class="course-container">
        <p>Created by Si Ersheng</p>
        <a href="../../index.html#project">Take me back home 🏡</a>
        <br />
        <p class="happy">
          Want to create your own GIFt site? Take this
          <a href="https://scrimba.com/courses" target="_blank"
            >CSS & HTML course at Scrimba!
          </a>
        </p>
      </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leads Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <input
      type="text"
      id="input-el"
      placeholder="Paste a link or type a note"
      aria-label="Link or note to save"
    />
    <button type="button" id="input-btn">SAVE INPUT</button>
    <button type="button" id="tab-btn">SAVE TAB</button>
    <button type="button" id="delete-btn" title="Double-click to delete all">
      DELETE ALL
    </button>
    <p id="msg" role="status" aria-live="polite"></p>
    <ul id="ul-el"></ul>
    <script src="script.js"></script>
  </body>
</html>

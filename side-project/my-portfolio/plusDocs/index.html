      <h1>Hello, I'm Frank Si.</h1>

    <section id="contact">
      <h2>Contact Me</h2>
      <form>
        <label for="name">Your Name</label>
        <input type="text" class = "form-input" id="name" placeholder="Enter your name" required />

        <label for="email">Your Email</label>
        <input type="email" class = "form-input" id="email" placeholder="Enter your email" required />

        <label for="message">Your Message? or Question</label>
        <textarea class = "form-input" id="message" placeholder="Any thoughts?"></textarea>

        <label for="age">Age</label>
        <input type="number" class = "form-input" id="age" placeholder="Enter your age" required />

        <button type="submit">Send</button>
      </form>
